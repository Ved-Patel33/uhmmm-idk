<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Story - Valentine's Day</title>
  <meta name="description" content="An interactive story leading up to a special Valentine's Day question.">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Outfit', sans-serif;
    }
  </style>
</head>

<body>
  <div id="game-container">
    <!-- Background Layer -->
    <div id="background-layer"></div>

    <!-- Character Layer -->
    <div id="character-layer"></div>

    <!-- Hotspots Container -->
    <div id="hotspots-container"></div>

    <!-- Scene Indicator (shows current scene in placeholder mode) -->
    <div id="pscene-indicator"></div>
    <div id="thought-bubble"></div>

    <!-- Dialogue Box -->
    <div id="dialogue-container">
      <div id="speaker-name"></div>
      <div id="dialogue-text"></div>
      <div id="choices-container"></div>
      <div id="click-indicator">▼ Click to continue</div>
    </div>

    <!-- Fade Overlay -->
    <div id="fade-overlay"></div>

    <!-- Time Skip Overlay -->
    <div id="time-skip-overlay">
      <div id="time-skip-text"></div>
    </div>

    <!-- Ending Screen -->
    <div id="ending-screen">
      <h1></h1>
      <p></p>
    </div>
  </div>

  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Game Scripts -->
  <script src="scenes.js"></script>
  <script src="game.js"></script>
</body>

</html>
